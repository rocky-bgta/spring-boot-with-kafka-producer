name: Kafka producer unit tests

on:
  push:
    branches: [main, fix/kafka-producer-full-suite-ci]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run complete test suite and package
        run: mvn -B --no-transfer-progress verify
